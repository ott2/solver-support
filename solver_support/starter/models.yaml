# A starter model registry for solver-support.
#
# Covers Conjure (Essence) and Savile Row (Essence Prime) constraint models and
# Fast Downward, SymK and ENHSP planning models.
#
# solver-support ships unwired: it has no models.yaml of its own and will not
# guess one. This file is a starting point to copy and edit, not a default.
# Write it out with
#
#     from solver_support import write_starter_config
#     write_starter_config("config/models.yaml")
#
# and wire it before first use:
#
#     from solver_support import set_default_config_path, set_resource_root
#     set_default_config_path("config/models.yaml")
#     set_resource_root(".")      # where the `path:` entries below resolve
#
# The file has two sections, and they are independent of each other.
# `models:` lists your models: what the problem is, as a model file.
# `solvers:` says how to run each solver: its command, its time-limit handling,
# and its `tune:` presets (the named search configurations a `--tune` flag picks
# between). A model's `solver:` is only its default. Any solver that takes the
# same kind of file can run it, so the one `pddl` model below runs under `fd`,
# `symk` or `enhsp` (`ModelRegistry.is_solver_compatible_with_model` decides).
# Each solver's `default_model` is the model it runs when none is named.
#
# Delete the solvers you do not have installed and the models you do not need.
# Every `command:` must be on PATH; check with
# `ModelRegistry().is_command_available`.
#
# Not covered here, because each needs more from you than a config entry:
#   - UPF-constructed models: the core shells out to a UPF planner CLI you
#     provide (see docs/injection-api.md, seam 4).
#   - Scoring: what an objective means is injected, not configured
#     (docs/injection-api.md, seam 2).

models:
  # An Essence model. Conjure refines it to Essence Prime once (`modelling`),
  # then for each horizon N = 2, 3, ... translates the instance, has Savile
  # Row tailor and solve it (under the entry the `conjure` solver names), and
  # translates the solution back. The horizon reaches the model as `letting horizon be N`, appended to
  # the instance, for each name in `horizon-params`. These must be exactly the
  # parameters the model declares (here `given horizon : int(1..100)`), because
  # Conjure rejects a parameter the model does not have.
  essence:
    path: models/model.essence
    solver: conjure
    horizon-params: [horizon]
    description: Essence model, refined by Conjure and solved via Savile Row

  # A PDDL planning model: `path` is the domain file, and the instance (problem)
  # file is given per run. Fast Downward runs it by default; SymK and ENHSP
  # can run it too. `proves-unsat: true` says this model can *prove* there is
  # no plan, given a complete search. It is safe to leave on for these three
  # planners, because each records a verdict read off its own log: a run is
  # concluded unsat only when its search ran out of states without being
  # bounded or pruning anything (for Fast Downward, only blind A* qualifies),
  # never just because it found no plan. The one tune that cannot prove (the
  # `soup` portfolio) opts out below. A solver whose backend records no
  # verdict, such as a UPF planner whose CLI writes no result file, never
  # concludes unsat, whatever this says.
  pddl:
    path: models/domain.pddl
    solver: fd
    proves-unsat: true
    description: PDDL planning model

  # An Essence Prime model, tailored by Savile Row and solved by its backend
  # over horizons N = 1, 2, ..., each appended to the instance as
  # `letting horizon be N`, so the model declares `given horizon : int`.
  # A bounded model like this (and the Essence one above) cannot prove
  # unsatisfiability: refuting horizons 1..N says nothing about N+1. So neither
  # claims `proves-unsat`. Set `opt: true` if the model minimises or maximises
  # something.
  eprime:
    path: models/model.eprime
    solver: savilerow
    horizon-params: [horizon]
    description: Essence Prime model, tailored and solved by Savile Row

solvers:
  fd:
    default_model: pddl
    solver_type: fd
    command: fd              # Fast Downward's fast-downward.py, under this name
    extensions:
      - .pddl
    default_timeout: 600     # seconds; becomes --search-time-limit
    default_tune: blind
    tune:
      blind:
        search: "astar(blind())"
        description: cost-optimal blind A*; complete on any task
      lmcut:
        search: "astar(lmcut())"
        description: cost-optimal A* with LM-cut; rejects tasks with axioms
      ff:
        search: "lazy_greedy([ff()])"
        # Greedy search with FF, which prunes states it scores as infinite: not
        # a search whose exhaustion is a proof. The verdict reads it as
        # `unknown` (`unverified-search`, or `unsafe-pruning` on a task with
        # axioms); only blind A* exhausting is read as `unsat`.
        description: satisficing greedy best-first search with FF
      soup:
        alias: seq-sat-fdss-2018
        regime: anytime
        proves-unsat: false
        description: anytime satisficing portfolio, keeps improving its plan

  symk:
    # SymK is a Fast Downward fork with the same driver and output.
    default_model: pddl
    solver_type: fd
    command: symk
    extensions:
      - .pddl
    default_timeout: 600
    default_tune: bd
    tune:
      bd:
        search: "sym_bd()"
        description: bidirectional symbolic search
      fw:
        search: "sym_fw()"
        description: forward symbolic search
      bw:
        search: "sym_bw()"
        description: backward symbolic search

  enhsp:
    default_model: pddl
    solver_type: enhsp
    command: enhsp
    extensions:
      - .pddl
    # ENHSP has no time limit of its own outside anytime mode; the runner's
    # timeout stops it.
    default_timeout: 600
    default_tune: opt
    tune:
      opt:
        planner: opt-blind
        description: optimal search, blind heuristic
      sat:
        planner: sat-hmrp
        description: satisficing search, MRP heuristic

  conjure:
    solver_type: conjure
    default_model: essence
    command: conjure
    # The Savile Row entry that tailors and solves each horizon, and whose
    # `tune:` presets an Essence run's `--tune` picks between.
    savilerow: savilerow
    extensions:
      - .essence
    default_timeout: 600
    # Each list starts with the Conjure subcommand; the core appends the files.
    # `-ac` picks the first refinement Conjure offers at every choice point,
    # which gives the single model the pipeline expects.
    modelling_args:
      - "modelling"
      - "-ac"
    translate_parameter_args:
      - "translate-parameter"
    translate_solution_args:
      - "translate-solution"
    description: refines Essence to Essence Prime and translates instances and solutions

  # Savile Row: it tailors the model and instance into the backend's input,
  # which often decides the result as much as the backend does, then runs the
  # backend. This entry targets SAT. For another backend, copy the entry under a
  # name like `savilerow-minion`, set `backend: minion`, and give its tunes
  # `minion_args` (backends: minion, ortools, gecode, chuffed; each reads its
  # own `<backend>_args`).
  savilerow:
    solver_type: savilerow
    default_model: eprime
    command: savilerow
    extensions:
      - .eprime
    # Seconds. Savile Row's own -timelimit bounds tailoring, then the SAT
    # solver gets its own limit. The two run one after the other, so size the
    # runner's timeout with `savilerow_backstop`.
    default_timeout: 600
    # `backend:` is absent, which means SAT.
    default_tune: default
    tune:
      default:
        sat_args:
          - "-run-solver"
          - "-sat"
          - "-sat-family"
          - "kissat"
        description: Savile Row driving kissat

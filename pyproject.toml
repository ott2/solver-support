[build-system]
# >=77 because `license` below is the PEP 639 SPDX-expression form: 76.1.0
# rejects a bare string ("must be valid exactly by one definition", wanting a
# {text=...}/{file=...} table), 77.0.1 accepts it. The old >=45 floor predated
# PEP 639 and would fail to build the very licence it declares. This costs
# nothing in Python support: setuptools dropped 3.8 back in 75.4.0 and kept 3.9
# until 83.0.0, so the whole 77.0.1-82.x range is available to requires-python
# below.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solver-support"
version = "0.1.0"
description = "Generic Conjure / Savile Row / Fast Downward / SymK / ENHSP / UPF solver pipeline"
readme = "README.md"
requires-python = ">=3.9"
license = "BSD-3-Clause"
authors = [
    {name = "András Salamon"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "psutil>=5.8.0",  # robust process management, timeouts, cleanup
    "PyYAML>=5.4",    # model-registry loader (consumers supply their own yaml)
]

# Extras are populated during the physical extraction (Phase 3/4), when the
# modules that need them (plotting, the UPF driver) actually move across.
[project.optional-dependencies]
plot = [
    # pandas / matplotlib -- filled in when plot.py moves
]
upf = [
    # up-fast-downward / up-enhsp / unified_planning fork pin -- filled in when
    # upf_common.py / solver_upfplan.py move (see puzznic-support pyproject for
    # the pinned revision and why bidict/ortools must be listed explicitly)
]

[dependency-groups]
dev = [
    "pytest>=6.0",
    "pytest-cov",
    "pytest-mock",
]

[tool.setuptools]
zip-safe = false

[tool.setuptools.packages.find]
include = ["solver_support*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (may take more than a few seconds)",
]

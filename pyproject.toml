[build-system]
# >=77 because `license` below is the PEP 639 SPDX-expression form: 76.1.0
# rejects a bare string ("must be valid exactly by one definition", wanting a
# {text=...}/{file=...} table), 77.0.1 accepts it. The old >=45 floor predated
# PEP 639 and would fail to build the very licence it declares. This costs
# nothing in Python support: setuptools dropped 3.8 back in 75.4.0 and kept 3.9
# until 83.0.0, so the whole 77.0.1-82.x range is available to requires-python
# below.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solver-support"
version = "0.1.0"
description = "Generic Conjure / Savile Row / Fast Downward / SymK / ENHSP / UPF solver pipeline"
readme = "README.md"
requires-python = ">=3.9"
license = "BSD-3-Clause"
authors = [
    {name = "András Salamon"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    # 3.9 is deliberate and load-bearing: it is the system Python on macOS
    # (3.9.6), where most people likely to install this already are, so a source
    # install must not need a newer interpreter. Verified by building and running
    # the suite on /usr/bin/python3.
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "psutil>=5.8.0",  # robust process management, timeouts, cleanup
    "PyYAML>=5.4",    # model-registry loader (consumers supply their own yaml)
]

[project.urls]
Homepage = "https://github.com/ott2/solver-support"
Repository = "https://github.com/ott2/solver-support"
Issues = "https://github.com/ott2/solver-support/issues"

# No optional-dependencies yet. `plot` and `upf` were declared here as empty
# placeholders during the extraction; on a published package an empty extra is a
# trap, since `pip install solver-support[upf]` then succeeds while installing
# nothing at all, and the user concludes the UPF route is set up when it is not.
# Re-add each when it actually carries requirements:
#   plot -> pandas / matplotlib, when a plotting module moves across
#   upf  -> up-fast-downward / up-enhsp / the unified_planning fork pin (see
#           puzznic-support's pyproject for the revision, and for why bidict and
#           ortools have to be listed explicitly)
# Note the core does not import unified_planning at all: solver_upfplan shells
# out to a consumer-provided CLI, so the upf extra belongs to whoever ships that.

[dependency-groups]
dev = [
    "pytest>=6.0",
    "pytest-cov",
    "pytest-mock",
]

[tool.setuptools]
zip-safe = false

[tool.setuptools.packages.find]
include = ["solver_support*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (may take more than a few seconds)",
]

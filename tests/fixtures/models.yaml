# Synthetic model registry for the core's own tests.
#
# The core ships without a registry -- a consumer injects the path to its own
# models.yaml (see docs/injection-api.md). Tests that reach the registry wire
# THIS file instead, so the core is exercised against a config it owns rather
# than against whichever consumer happens to be installed beside it. Keep it
# minimal: add only what a test actually reads, and keep the shape faithful to a
# real consumer config (that shape is the contract the loader and the accessors
# implement).

models:
  # A constructed UPF model: built in Python, solved through the UPF driver.
  upf:
    path: upf.py
    solver: upffd
    detection_type: upf
    format-name: upf
    proves-unsat: true
    description: constructed UPF model, solved by Fast Downward via UPF

  # An optimisation model whose objective is recorded in the solution file, so
  # the horizon scan compares objectives between horizons.
  scored:
    path: models/Scored.eprime
    solver: kissat
    detection_type: scored
    format-name: compact
    objective-in-solution: true
    description: optimisation model carrying its objective in the solution

  # A PDDL model solved directly by Fast Downward. It proves unsat, but only
  # under a search that is complete and prunes safely - which is a property of
  # the tune, so the `fd` presets below say which of them can.
  pddl:
    path: domain.pddl
    solver: fd
    detection_type: pddl
    format-name: pddl
    proves-unsat: true
    description: PDDL model, solved by Fast Downward

  # The same model with a pinned tune that cannot prove.
  pddlff:
    path: domain.pddl
    solver: fd
    detection_type: pddl
    format-name: pddl
    proves-unsat: true
    tune: ff
    description: PDDL model pinned to a greedy FF search

  # Horizon models naming the parameter the scan sets to the horizon: one on
  # the model itself, one inheriting it from its solver, and one with neither,
  # which gets the route's historical names.
  stepped:
    path: models/Stepped.eprime
    solver: srsat
    horizon-params: steps
    description: horizon model naming its own horizon parameter
  minionstepped:
    path: models/MinionStepped.eprime
    solver: srminion
    description: horizon model inheriting its solver's horizon parameter

solvers:
  # Conjure with no `savilerow:` key, the shape configs written before the key
  # existed have: it delegates each horizon to the legacy `kissat` entry.
  conjure:
    solver_type: conjure
    command: conjure
    extensions:
      - .essence
    default_timeout: null
    modelling_args: ["modelling", "-ac"]
    translate_parameter_args: ["translate-parameter"]
    translate_solution_args: ["translate-solution"]

  fd:
    solver_type: fd
    command: fd
    extensions:
      - .pddl
    default_timeout: 600
    default_tune: blind
    tune:
      blind:
        search: "astar(blind())"
        description: cost-optimal blind A*, complete on any task
      lmcut:
        search: "astar(lmcut())"
        # LM-cut is not on the built-in allowlist; this config vouches for it.
        proves-unsat: true
        description: cost-optimal A* with LM-cut
      ff:
        search: "lazy_greedy([ff()])"
        # FF prunes infinite-valued states even where axioms make that unsafe,
        # so an exhausted search under it proves nothing.
        proves-unsat: false
        description: satisficing greedy best-first with FF
      soup:
        alias: seq-sat-fdss-2018
        regime: anytime
        proves-unsat: false
        description: the anytime satisficing portfolio

  upffd:
    # Fast Downward through the Unified Planning Framework. The engine and the
    # FD search config are BOTH resolved from the effective --tune, which is
    # what UpfPlanSolver turns into `-s <engine>` and `--fd-search <search>`.
    solver_type: upfplan
    command: upfplan
    extensions:
      - .pddl
    default_timeout: 600
    engine_name: fast-downward
    default_tune: optimal
    tune:
      optimal:
        fd_search: "astar(blind())"
        description: cost-optimal blind A*
      satisficing:
        fd_search: "lazy_greedy([ff()])"
        description: satisficing greedy best-first with FF
      lmcut:
        fd_search: "astar(lmcut())"
        proves-unsat: true
        description: cost-optimal A* with LM-cut, vouched for by this config

  kissat:
    solver_type: savilerow
    command: savilerow
    extensions:
      - .eprime
    default_timeout: 600
    description: SAT backend driven through Savile Row

  # The Savile Row backends, with tune presets, for the command builder tests.
  # Separate from `kissat` above so that adding them cannot perturb the tests
  # which rely on that entry having no presets.
  #
  # One entry per backend, plus two that pin a solver binary. Two, because the
  # flag that names the binary differs per backend (-fzn-bin vs -gecode-bin), so
  # a single pinned entry could not tell a per-backend flag apart from a
  # hardcoded one.
  srsat:
    # No `backend:` key at all -- the shape every pre-existing SAT config has.
    solver_type: savilerow
    command: savilerow
    extensions:
      - .eprime
    default_timeout: null
    default_tune: default
    tune:
      default:
        sat_args:
          - "-run-solver"
          - "-sat"
        description: SAT backend
      exact:
        sat_args:
          - "-run-solver"
          - "-sat"
          - "-S0"
        description: SAT backend, keeping the solution set (-S0)
      exact-withdrawn:
        sat_args:
          - "-run-solver"
          - "-sat"
          - "-S0"
        # Takes the claim away (an option known to change solutions, say).
        preserves-solutions: false
        description: -S0, but this config withdraws the claim

  srminion:
    solver_type: savilerow
    command: savilerow
    extensions:
      - .eprime
    default_timeout: null
    backend: minion
    horizon-params: [t]
    default_tune: default
    tune:
      default:
        minion_args:
          - "-run-solver"
        description: Minion backend

  srortools:
    solver_type: savilerow
    command: savilerow
    extensions:
      - .eprime
    default_timeout: null
    backend: ortools
    default_tune: default
    tune:
      default:
        ortools_args:
          - "-run-solver"
          - "-or-tools"
        description: OR-Tools CP-SAT backend

  srgecode:
    solver_type: savilerow
    command: savilerow
    extensions:
      - .eprime
    default_timeout: null
    backend: gecode
    default_tune: default
    tune:
      default:
        gecode_args:
          - "-run-solver"
          - "-gecode"
        description: Gecode FlatZinc backend

  srchuffed:
    solver_type: savilerow
    command: savilerow
    extensions:
      - .eprime
    default_timeout: null
    backend: chuffed
    default_tune: default
    tune:
      default:
        chuffed_args:
          - "-run-solver"
          - "-chuffed"
        description: Chuffed FlatZinc backend

  srortoolsbin:
    # Same as srortools, but pinning the solver binary by name.
    solver_type: savilerow
    command: savilerow
    extensions:
      - .eprime
    default_timeout: null
    backend: ortools
    solver_bin: fzn-ortools
    default_tune: default
    tune:
      default:
        ortools_args:
          - "-run-solver"
          - "-or-tools"
        description: OR-Tools CP-SAT backend, binary pinned

  srgecodebin:
    # The same pin on a different backend, which must reach a different flag.
    # Also carries a timeout-dialect override, so one entry covers both config
    # escape hatches: the flag name is the config's to change, while the unit
    # stays the solver's (still milliseconds here).
    solver_type: savilerow
    command: savilerow
    extensions:
      - .eprime
    default_timeout: null
    backend: gecode
    solver_bin: fzn-gecode-6
    solver_timeout_option: "-overall-time {value}"
    default_tune: default
    tune:
      default:
        gecode_args:
          - "-run-solver"
          - "-gecode"
        description: Gecode backend, binary pinned

  srbadbackend:
    # A wrong backend name: must be rejected, not silently run as SAT.
    #
    # `or-tools` rather than an obviously-mangled string, because this is the
    # mistake someone would actually make: Savile Row's flag is `-or-tools`, so a
    # config author copying the name out of the documentation writes the
    # hyphenated form. A test that only rejects gibberish would not have caught
    # the near-miss that matters.
    solver_type: savilerow
    command: savilerow
    extensions:
      - .eprime
    default_timeout: null
    backend: or-tools
    default_tune: default
    tune:
      default:
        # Carries sat_args too, which is what makes the silent-fallback failure
        # possible at all: without them the mistake would surface as a missing
        # arg-set rather than as a wrong-but-working command line.
        sat_args:
          - "-run-solver"
          - "-sat"
        ortools_args:
          - "-run-solver"
          - "-or-tools"
        description: deliberately misspelled backend
